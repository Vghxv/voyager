# voyager — hyprlock theme
# Matches the voyager Plymouth boot screen: starfield, probe, indigo/teal palette.
# Files live in ~/.config/hypr/voyager/  (see README in this folder)

$voyager = ~/.config/hypr/voyager
$font    = DejaVu Sans

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier  = linear, 1, 1, 0, 0
    bezier  = ease, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 8, linear            # also drives the starfield crossfade (~0.8 s)
    animation = fadeOut, 1, 5, ease
    animation = inputFieldDots, 1, 3, ease      # each star-dot fades in
    animation = inputFieldColors, 1, 4, ease    # outline colour changes (typing / fail)
}

# ---------- background: twinkling starfield on every monitor ----------
background {
    monitor     =
    path        = $voyager/stars-0.png
    reload_time = 1                             # seconds
    reload_cmd  = $voyager/next-frame.sh        # picks the next of 6 frames
    blur_passes = 0
}

# ---------- widgets: shown on every monitor ----------

# probe
image {
    monitor     =
    path        = $voyager/probe.png
    size        = 260
    rounding    = 0
    border_size = 0
    position    = 0, 190
    halign      = center
    valign      = center
}

# title
label {
    monitor     =
    text        = voyager
    color       = rgba(217, 217, 242, 1.0)
    font_size   = 26
    font_family = $font
    position    = 0, 20
    halign      = center
    valign      = center
}

# time
label {
    monitor     =
    text        = $TIME
    color       = rgba(153, 153, 179, 1.0)
    font_size   = 14
    font_family = $font
    position    = 0, -12
    halign      = center
    valign      = center
}

# password
input-field {
    monitor           =
    size              = 420, 52
    position          = 0, -80
    halign            = center
    valign            = center

    outline_thickness = 2
    rounding          = 26
    inner_color       = rgba(10, 10, 20, 0.55)
    outer_color       = rgba(94, 234, 212, 0.55) rgba(139, 143, 240, 0.55) 45deg
    check_color       = rgba(139, 143, 240, 0.9) rgba(94, 234, 212, 0.9) 120deg
    fail_color        = rgba(255, 51, 85, 0.95)
    font_color        = rgba(217, 217, 242, 1.0)
    font_family       = $font

    dots_text_format  = ✦
    dots_size         = 0.45
    dots_spacing      = 0.35
    dots_center       = true

    fade_on_empty     = false
    placeholder_text  = <span foreground="##8080a0"><i>password, then enter to launch</i></span>
    check_text        = <i>launching…</i>
    fail_text         = <span foreground="##ff3355">signal lost — $ATTEMPTS</span>
}
