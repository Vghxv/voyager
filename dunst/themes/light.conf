# voyager — dunst light mode: mist panels, navy text
[global]
    highlight = "#5EEAD4"

[urgency_low]
    background = "#D9D9F2EB"
    foreground = "#5A5A78"
    frame_color = "#8B8FF080"
    highlight = "#5EEAD4"
    timeout = 5
    default_icon = dialog-information

[urgency_normal]
    background = "#D9D9F2EB"
    foreground = "#14141F"
    frame_color = "#8B8FF0"
    highlight = "#5EEAD4"
    timeout = 8
    default_icon = dialog-information

[urgency_critical]
    background = "#FFB3C0F2"
    foreground = "#14141F"
    frame_color = "#FF3355"
    highlight = "#FF3355"
    timeout = 0
    default_icon = dialog-warning
