[package]
name = "voyager-sky"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
resolver = "3"
description = "voyager's celestial-sphere wallpaper: drag mode on the desktop layer, and PNG export"
license = "MIT"
publish = false

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
glyphon = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
pollster = "0.4"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = "0.21"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wgpu = { version = "25", default-features = false, features = ["vulkan", "wgsl"] }

[profile.release]
lto = "thin"
strip = true
