<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Voyager, after the JPL spacecraft diagram (Voyager Bulletin no. 13, 1978):
       3.7 m ribbed high-gain antenna over the decagonal bus; science boom (right) and
       RTG boom (left) on opposite sides; the three RTGs stacked end to end; IRIS dish and
       NA/WA cameras on the scan platform; 13 m triangular magnetometer truss with low-field
       sensors at its middle and tip; two 10 m PRA/PWS whips; Golden Record on the bus.
       Ids are prefixed vg- because gen-wallpaper.py inlines this file into a larger SVG.
       Dish centre stays at (190,147): Plymouth and the wallpaper start their signal rings there. -->
  <defs>
    <linearGradient id="vg-bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B8FF0"/>
      <stop offset="0.5" stop-color="#C9CBF6"/>
      <stop offset="1" stop-color="#F2F2FD"/>
    </linearGradient>
    <linearGradient id="vg-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7C9EE"/>
    </linearGradient>
    <linearGradient id="vg-shell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A7FE8"/>
      <stop offset="1" stop-color="#3D4199"/>
    </linearGradient>
    <linearGradient id="vg-rtg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6E6FA"/>
      <stop offset="0.5" stop-color="#B4B7FF"/>
      <stop offset="1" stop-color="#6267D3"/>
    </linearGradient>
    <linearGradient id="vg-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5D98B"/>
      <stop offset="1" stop-color="#B8893A"/>
    </linearGradient>
  </defs>

  <!-- PRA / PWS whip antennas -->
  <g stroke="#D9D9F2" stroke-width="1.4" stroke-linecap="round" opacity="0.7">
    <line x1="196" y1="242" x2="100" y2="394"/>
    <line x1="204" y1="242" x2="258" y2="398"/>
  </g>

  <!-- lattice booms: two rails + zigzag -->
  <g stroke="#D9D9F2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- magnetometer (13 m astromast) -->
    <line x1="210.9" y1="241.3" x2="364.9" y2="387.3"/><line x1="217.1" y1="234.7" x2="371.1" y2="380.7"/>
    <path d="M210.9,241.3 L225.2,242.4 L227.1,256.6 L241.4,257.8 L243.3,272.0 L257.6,273.2 L259.5,287.4 L273.8,288.5 L275.7,302.7 L290.0,303.9 L292.0,318.1 L306.3,319.3 L308.2,333.5 L322.5,334.6 L324.4,348.8 L338.7,350.0 L340.6,364.2 L354.9,365.4 L356.8,379.6 L371.1,380.7" stroke-width="1.1"/>
    <!-- science boom -->
    <line x1="222.9" y1="217.9" x2="312.9" y2="195.9"/><line x1="221.1" y1="210.1" x2="311.1" y2="188.1"/>
    <path d="M222.9,217.9 L231.1,207.7 L242.9,213.0 L251.1,202.8 L262.9,208.1 L271.1,197.9 L282.9,203.2 L291.1,193.0 L302.9,198.3 L311.1,188.1" stroke-width="1.1"/>
    <!-- RTG boom -->
    <line x1="179.1" y1="225.1" x2="115.1" y2="240.1"/><line x1="180.9" y1="232.9" x2="116.9" y2="247.9"/>
    <path d="M179.1,225.1 L171.8,235.0 L160.8,229.4 L153.5,239.3 L142.5,233.7 L135.2,243.6 L124.2,238.0 L116.9,247.9" stroke-width="1.1"/>
  </g>

  <!-- low-field magnetometers: middle and tip -->
  <rect x="285" y="306" width="12" height="9" rx="2" fill="#E6E6FA" transform="rotate(43 291 310)"/>
  <rect x="362" y="379" width="12" height="9" rx="2" fill="#E6E6FA" transform="rotate(43 368 384)"/>

  <!-- three RTGs end to end; local +x runs outward along the boom -->
  <g transform="translate(116 244) rotate(166.8)">
    <g stroke="#C7C9EE" stroke-width="1.6" stroke-linecap="round">
      <line x1="2" y1="-12" x2="2" y2="12"/><line x1="28" y1="-12" x2="28" y2="12"/>
      <line x1="54" y1="-12" x2="54" y2="12"/><line x1="80" y1="-12" x2="80" y2="12"/>
    </g>
    <rect x="2" y="-8" width="78" height="16" rx="3" fill="url(#vg-rtg)"/>
    <g stroke="#3D4199" stroke-width="0.8" opacity="0.4">
      <line x1="4" y1="-4" x2="78" y2="-4"/><line x1="4" y1="0" x2="78" y2="0"/><line x1="4" y1="4" x2="78" y2="4"/>
    </g>
    <g stroke="#E6E6FA" stroke-width="2">
      <line x1="28" y1="-8" x2="28" y2="8"/><line x1="54" y1="-8" x2="54" y2="8"/>
    </g>
    <ellipse cx="80" cy="0" rx="3" ry="8" fill="#9CA0FF"/>
  </g>

  <!-- science boom instruments: cosmic ray (box), LECP (drum) -->
  <rect x="244" y="190" width="12" height="10" rx="2" fill="#9CA0FF" transform="rotate(-14 250 195)"/>
  <rect x="280" y="182" width="11" height="12" rx="3" fill="#B9BBE8" transform="rotate(-14 285 188)"/>

  <!-- scan platform: plasma, NA/WA cameras, PPS, IRIS dish, UVS -->
  <g transform="rotate(-14 322 190)">
    <rect x="308" y="182" width="26" height="18" rx="3" fill="#7A7FE8"/>
    <rect x="300" y="178" width="10" height="14" rx="2" fill="#9CA0FF"/>
    <rect x="314" y="152" width="10" height="32" rx="2.5" fill="#E6E6FA"/>
    <ellipse cx="319" cy="152" rx="5" ry="2" fill="#4B4FB8"/>
    <rect x="326" y="164" width="7" height="20" rx="2" fill="#C7C9EE"/>
    <ellipse cx="329.5" cy="164" rx="3.5" ry="1.5" fill="#4B4FB8"/>
    <rect x="305" y="164" width="8" height="12" rx="2" fill="#B4B7FF"/>
    <rect x="345" y="178" width="5" height="14" fill="#B9BBE8"/>
    <ellipse cx="350" cy="174" rx="18" ry="11" fill="#9CA0FF"/>
    <ellipse cx="350" cy="172" rx="15" ry="8.5" fill="#D9D9F2"/>
    <ellipse cx="350" cy="172" rx="5" ry="2.8" fill="#7A7FE8"/>
    <rect x="348" y="160" width="4" height="12" fill="#E6E6FA"/>
    <rect x="356" y="160" width="8" height="7" rx="1.5" fill="#B4B7FF"/>
  </g>

  <!-- bus: decagonal prism with the Golden Record -->
  <g transform="rotate(-12 200 216)">
    <polygon points="168,207 182,213 182,238 168,232" fill="#9CA0FF"/>
    <polygon points="182,213 200,215 200,240 182,238" fill="#7A7FE8"/>
    <polygon points="200,215 218,213 218,238 200,240" fill="#6267D3"/>
    <polygon points="218,213 232,207 232,232 218,238" fill="#4B4FB8"/>
    <polygon points="168,207 182,201 218,201 232,207 218,213 200,215 182,213" fill="#B4B7FF"/>
    <ellipse cx="191" cy="226.5" rx="7" ry="8" fill="url(#vg-gold)"/>
    <ellipse cx="191" cy="226.5" rx="2" ry="2.3" fill="#8A6424"/>
    <polygon points="221,216 229,212 229,222 221,226" fill="#E6E6FA" opacity="0.8"/>
  </g>

  <!-- high-gain antenna: ribbed dish, Cassegrain subreflector on a tripod -->
  <g transform="rotate(-12 190 147)">
    <ellipse cx="190" cy="156" rx="96" ry="36" fill="url(#vg-shell)"/>
    <ellipse cx="190" cy="147" rx="96" ry="33" fill="url(#vg-rim)"/>
    <ellipse cx="190" cy="147" rx="86" ry="27" fill="url(#vg-bowl)"/>
    <g stroke="#6267D3" stroke-width="0.9" opacity="0.3" fill="none">
      <ellipse cx="190" cy="149" rx="58" ry="18"/>
      <ellipse cx="190" cy="150" rx="30" ry="9"/>
      <line x1="190" y1="150" x2="275.0" y2="147.0"/><line x1="190" y1="150" x2="269.9" y2="155.9"/><line x1="190" y1="150" x2="255.1" y2="163.7"/><line x1="190" y1="150" x2="232.5" y2="169.5"/><line x1="190" y1="150" x2="204.8" y2="172.6"/><line x1="190" y1="150" x2="175.2" y2="172.6"/><line x1="190" y1="150" x2="147.5" y2="169.5"/><line x1="190" y1="150" x2="124.9" y2="163.7"/><line x1="190" y1="150" x2="110.1" y2="155.9"/><line x1="190" y1="150" x2="105.0" y2="147.0"/><line x1="190" y1="150" x2="110.1" y2="138.1"/><line x1="190" y1="150" x2="124.9" y2="130.3"/><line x1="190" y1="150" x2="147.5" y2="124.5"/><line x1="190" y1="150" x2="175.2" y2="121.4"/><line x1="190" y1="150" x2="204.8" y2="121.4"/><line x1="190" y1="150" x2="232.5" y2="124.5"/><line x1="190" y1="150" x2="255.1" y2="130.3"/><line x1="190" y1="150" x2="269.9" y2="138.1"/>
    </g>
    <ellipse cx="190" cy="150" rx="9" ry="3.5" fill="#B4B7FF"/>
    <g stroke="#F2F2FD" stroke-width="2.2" stroke-linecap="round">
      <line x1="130" y1="158" x2="186" y2="104"/>
      <line x1="250" y1="158" x2="194" y2="104"/>
      <line x1="190" y1="172" x2="190" y2="106"/>
    </g>
    <ellipse cx="190" cy="102" rx="13" ry="4.5" fill="#FFFFFF"/>
    <rect x="186" y="88" width="8" height="12" rx="2" fill="#D9D9F2"/>
    <ellipse cx="190" cy="88" rx="5" ry="2" fill="#FFFFFF"/>
  </g>
</svg>
