# voyager — dunst dark mode: navy glass panels, mist text
[global]
    highlight = "#5EEAD4"

[urgency_low]
    background = "#0A0A14E0"
    foreground = "#7A7AA0"
    frame_color = "#8B8FF060"
    highlight = "#5EEAD4"
    timeout = 5
    default_icon = dialog-information

[urgency_normal]
    background = "#0A0A14E0"
    foreground = "#D9D9F2"
    frame_color = "#8B8FF0"
    highlight = "#5EEAD4"
    timeout = 8
    default_icon = dialog-information

[urgency_critical]
    background = "#1F0A12EB"
    foreground = "#FFB3C0"
    frame_color = "#FF3355"
    highlight = "#FF3355"
    timeout = 0
    default_icon = dialog-warning
